# Blog languages and topics, edited from the online editor (Blog settings).
# Posts store the permanent `id` (categories = language, tags = topics), so
# `name` and `short` (sidebar label) can be renamed freely. Never change an
# `id` once posts use it — it is also the topic's URL (/tags/#id).
languages:
  - id: bangla
    name: Bangla
  - id: english
    name: English
topics:
  - id: competitive-programming
    name: Competitive Programming
    short: CP
  - id: higher-studies
    name: Higher Studies
    short: PhD
  - id: education
    name: Education
    short: Edu
