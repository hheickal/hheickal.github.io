{% comment %} Open links to other websites in a new tab. {% endcomment %}
<script>
  document.querySelectorAll('a[href^="http"]').forEach(function (a) {
    if (a.hostname !== location.hostname) {
      a.target = "_blank";
      a.rel = "noopener noreferrer";
    }
  });
</script>
