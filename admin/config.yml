# Sveltia CMS configuration — https://sveltiacms.app/en/docs
# Sign in at https://hheickal.github.io/admin/ with "Sign In with Token"
# (fine-grained GitHub token, this repo only, Contents: read and write).

backend:
  name: github
  repo: hheickal/hheickal.github.io
  branch: master
  commit_messages:
    create: "Blog: add {{slug}}"
    update: "Blog: update {{slug}}"
    delete: "Blog: delete {{slug}}"
    uploadMedia: "Blog: upload {{path}}"
    deleteMedia: "Blog: delete {{path}}"

site_url: https://hheickal.github.io
display_url: https://hheickal.github.io

media_folder: images/posts
public_folder: /images/posts

collections:
  - name: posts
    label: Blog posts
    label_singular: Blog post
    folder: _posts
    create: true
    # File name Jekyll expects: YYYY-MM-DD-slug.md; the URL becomes /posts/YYYY/MM/slug/
    slug: "{{year}}-{{month}}-{{day}}-{{fields.url_slug}}"
    summary: "{{title}} · {{date}}"
    sortable_fields: [date, title]
    view_filters:
      - label: Published
        field: published
        pattern: true
      - label: Drafts
        field: published
        pattern: false
    fields:
      - { name: title, label: Title, widget: string }
      - name: url_slug
        preview: false
        label: URL name
        widget: string
        hint: "Short English name for the URL, e.g. phd-admission-timeline → /posts/2021/02/phd-admission-timeline/"
        pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Use lowercase letters, numbers and hyphens only"]
      - name: published
        preview: false
        label: Published (visible on the site)
        widget: boolean
        default: false
        hint: "Off = draft. The post is saved to GitHub but not shown on the site."
      - name: date
        preview: false
        label: Publish date
        widget: datetime
        format: YYYY-MM-DD
        time_format: false
        hint: "Set automatically to the day you first publish (a minute after saving). Later unpublish/republish keeps it."
      - name: last_modified_at
        preview: false
        label: Last edited
        widget: datetime
        format: YYYY-MM-DD
        time_format: false
        auto_now: true
        required: false
      - name: categories
        preview: false
        label: Language
        widget: relation
        collection: settings
        file: blog
        value_field: "{{languages.*.id}}"
        display_fields: ["{{languages.*.name}}"]
        search_fields: ["{{languages.*.name}}"]
        multiple: true
        min: 1
        max: 1
        hint: "Add languages under Settings → Blog languages & topics"
      - name: tags
        preview: false
        label: Topics
        widget: relation
        collection: settings
        file: blog
        value_field: "{{topics.*.id}}"
        display_fields: ["{{topics.*.name}}"]
        search_fields: ["{{topics.*.name}}"]
        multiple: true
        required: false
        hint: "Add topics under Settings → Blog languages & topics"
      - name: permalink
        preview: false
        label: Custom URL (optional)
        widget: string
        required: false
        hint: "Filled in automatically on first publish, which locks the post's address. Leave as is."
      - { name: body, label: Post, widget: markdown }

  - name: publications
    label: Publications
    label_singular: Publication
    folder: _publications
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    summary: "{{title}} · {{date}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - name: published
        preview: false
        label: Show on the site
        widget: boolean
        default: true
      - name: date
        preview: false
        label: Date
        widget: datetime
        format: YYYY-MM-DD
        time_format: false
        hint: "Publications are listed newest first by this date."
      - { name: venue, preview: false, label: Venue, widget: string, hint: "e.g. International Conference on Artificial Intelligence in Education" }
      - { name: paperurl, preview: false, label: Paper link, widget: string, required: false, hint: "Shown as a PDF / Paper button" }
      - { name: citation, preview: false, label: Citation, widget: text, required: false }
      - { name: excerpt, preview: false, label: Short summary, widget: text, required: false, hint: "One or two sentences shown in the publication list" }
      - name: tags
        preview: false
        label: Topics
        widget: relation
        collection: settings
        file: publications
        value_field: "{{topics.*.id}}"
        display_fields: ["{{topics.*.name}}"]
        search_fields: ["{{topics.*.name}}"]
        multiple: true
        required: false
        hint: "Add topics under Settings → Publication topics"
      - { name: collection, widget: hidden, default: publications }
      - { name: permalink, preview: false, label: Custom URL (optional), widget: string, required: false }
      - { name: body, label: Abstract / details (optional), widget: markdown, required: false }

  - name: teaching
    label: Teaching
    label_singular: Teaching entry
    folder: _teaching
    create: true
    slug: "{{year}}-{{slug}}"
    summary: "{{title}} · {{date}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: type, preview: false, label: Role, widget: string, hint: "e.g. Assistant Professor, Lecturer" }
      - { name: venue, preview: false, label: Institution, widget: string }
      - { name: location, preview: false, label: Location, widget: string, required: false }
      - { name: date, preview: false, label: Start date, widget: datetime, format: YYYY-MM-DD, time_format: false }
      - { name: collection, widget: hidden, default: teaching }
      - { name: permalink, preview: false, label: Custom URL (optional), widget: string, required: false }
      - { name: body, label: Details, widget: markdown }

  - name: pages
    label: Pages
    files:
      - name: about
        label: About (home page)
        file: _pages/about.md
        fields:
          - { name: permalink, widget: hidden, default: / }
          - { name: title, label: Title, widget: string }
          - { name: excerpt, widget: hidden, default: About me }
          - { name: author_profile, widget: hidden, default: true }
          - { name: redirect_from, widget: hidden, default: [/about/, /about.html] }
          - { name: body, label: Text, widget: markdown }
      - name: cv
        label: CV (PDF)
        file: _data/cv.yml
        editor:
          preview: false
        fields:
          - name: pdf
            label: CV file
            widget: file
            media_folder: /files
            public_folder: /files
            hint: "Upload a new PDF to replace the CV shown on the CV page."

  - name: settings
    label: Settings
    editor:
      preview: false
    files:
      - name: blog
        label: Blog languages & topics
        file: _data/blog.yml
        fields:
          - name: languages
            label: Languages
            widget: list
            summary: "{{fields.name}}"
            fields:
              - name: id
                label: ID (permanent)
                widget: uuid
                use_b32_encoding: true
                hint: "Generated automatically and locked. Posts store this; rename with Language below."
              - { name: name, label: Language, widget: string }
          - name: topics
            label: Topics
            widget: list
            summary: "{{fields.name}}"
            hint: "Rename a topic freely via Topic / Short label; posts follow automatically."
            fields:
              - name: id
                label: ID (permanent)
                widget: uuid
                use_b32_encoding: true
                hint: "Generated automatically and locked. Posts store this and the topic URL uses it."
              - { name: name, label: Topic, widget: string }
              - { name: short, label: Short label in sidebar (optional), widget: string, required: false }

      - name: publications
        label: Publication topics
        file: _data/publications.yml
        fields:
          - name: topics
            label: Topics
            widget: list
            summary: "{{fields.name}}"
            hint: "Rename freely; publications store the ID and follow automatically."
            fields:
              - name: id
                label: ID (permanent)
                widget: uuid
                use_b32_encoding: true
                hint: "Generated automatically and locked."
              - { name: name, label: Topic, widget: string }
