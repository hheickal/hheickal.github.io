# When a blog post is published for the first time (published: true and no
# permalink yet), set its date to today and lock its URL. See
# .github/scripts/set_publish_date.py.
name: Blog first-publish date

on:
  push:
    branches: [master]
    paths: ["_posts/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-first-publish
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp first-publish date and URL
        id: stamp
        run: |
          changed="$(python3 .github/scripts/set_publish_date.py)"
          echo "$changed"
          echo "changed<<EOF" >> "$GITHUB_OUTPUT"
          echo "$changed" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Commit (the push itself triggers the Pages build)
        if: steps.stamp.outputs.changed != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts
          git commit -m "Blog: set first-publish date" -m "$(echo '${{ steps.stamp.outputs.changed }}' | sed 's/^/- /')"
          git pull --rebase origin master
          git push
